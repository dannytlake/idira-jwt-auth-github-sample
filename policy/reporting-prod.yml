# Workload: the reporting app's prod pipeline.
#
#   conjur policy update -b data -f policy/reporting-prod.yml

# 1. Who the workload is.
#    It has no password and no API key. It logs in with a GitHub OIDC token,
#    and only from this repo and the prod branch.
- !host
  id: github-apps/reporting-prod
  annotations:
    authn-jwt/github/repository_id: "1400719326"
    authn-jwt/github/ref: refs/heads/prod

# 2. What the workload may read.
#    The prod-reporting-app safe, and nothing else.
- !grant
  role: !group vault/prod-reporting-app/delegation/consumers
  member: !host github-apps/reporting-prod
